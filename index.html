<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 響應式佈局作業</title>
    <style>
        /* 1. 基礎重設與背景 */
        body {
            background-color: #7bb3f4; /* 圖片最外層的藍色背景 */
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        /* 白色畫布容器 */
        .canvas {
            background-color: white;
            width: 100%;
            max-width: 600px;
            padding: 15px;
            box-sizing: border-box;
            border: 5px solid white;
        }

        /* 通用區塊設定：確保沒文字也能看到區塊 */
        .box {
            border-radius: 5px;
            margin: 5px;
        }

        /* --- 頂部綠色區塊 --- */
        .header {
            height: 100px;
            background-color: #b5d36b;
        }

        /* --- 中間藍綠色區塊 (主要的變動處) --- */
        .middle-container {
            display: flex;
            flex-direction: row; /* 預設橫排 (b) */
        }

        .middle-item {
            flex: 1;
            height: 80px; /* 固定高度，防止消失 */
            background-color: #63b9c4;
        }

        /* --- 底部灰色區塊 --- */
        .footer-container {
            display: flex;
            flex-direction: row; /* 預設橫排 (b) */
            margin-top: 5px;
        }

        .footer-item {
            flex: 1;
            height: 40px;
            background-color: #e5e5e5;
        }

        /* =========================================
           2. 響應式關鍵：寬度小於 480px 時 (Layout a)
           =========================================
        */
        @media screen and (max-width: 480px) {
            
            /* 中間區塊：從橫排變直排 */
            .middle-container {
                flex-direction: column;
            }

            .middle-item {
                height: 60px; /* 稍微調整手機版高度 */
                margin: 5px 0;
            }

            /* 底部區塊：改用網格變成 2x2 排列 */
            .footer-container {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            .footer-item {
                margin: 5px;
            }
        }
    </style>
</head>
<body>

    <div class="canvas">
        <div class="header box"></div>

        <div class="middle-container">
            <div class="middle-item box"></div>
            <div class="middle-item box"></div>
            <div class="middle-item box"></div>
        </div>

        <div class="footer-container">
            <div class="footer-item box"></div>
            <div class="footer-item box"></div>
            <div class="footer-item box"></div>
            <div class="footer-item box"></div>
        </div>
    </div>

</body>
</html>
