<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最終修正版</title>
    <style>
        body {
            background-color: #7bb3f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /* 關鍵點 1：高度不要寫死，用 min-height */
        .white-canvas {
            background-color: white;
            width: 100%;
            max-width: 500px;
            padding: 15px;
            min-height: 100px; 
            height: auto; /* 讓它隨內容自動變長 */
            box-sizing: border-box;
        }

        .box {
            border-radius: 5px;
            margin: 5px;
        }

        .header {
            height: 120px;
            background-color: #b5d36b;
        }

        /* 關鍵點 2：中間藍色區塊容器 */
        .middle-container {
            display: flex;
            flex-direction: row; /* 預設橫排 (Layout b) */
        }

        .blue-item {
            flex: 1;
            height: 80px;
            background-color: #008B8B; /* 深藍綠色，確保看得到 */
        }

        .footer-container {
            display: flex;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .gray-item {
            flex: 1;
            min-width: 20%;
            height: 40px;
            background-color: #d3d3d3;
        }

        /* 手機模式切換 */
        @media screen and (max-width: 480px) {
            .middle-container {
                flex-direction: column; /* 變直排 (Layout a) */
            }

            .blue-item {
                height: 70px;
                margin: 5px 0;
            }

            .footer-container {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="white-canvas">
        <div class="header box"></div>

        <div class="middle-container">
            <div class="blue-item box"></div>
            <div class="blue-item box"></div>
            <div class="blue-item box"></div>
        </div>

        <div class="footer-container">
            <div class="gray-item box"></div>
            <div class="gray-item box"></div>
            <div class="gray-item box"></div>
            <div class="gray-item box"></div>
        </div>
    </div>

</body>
</html>
